name: Build and deploy Aseprite

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
      - fix

env:
  BUILD_TYPE: Release
  VersionTag: latest # latest / tags/tag_name

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.version_info.outputs.download_url }}
      latest_tag: ${{ steps.version_info.outputs.latest_tag }}
      should_build: ${{ steps.should_build.outputs.should_build }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Get latest version info
      id: version_info
      run: |
        data=$(curl -sL "https://api.github.com/repos/aseprite/aseprite/releases/${{ env.VersionTag }}" -H "Accept: application/vnd.github.v3+json")
        LATEST_TAG=$(echo "$data" | jq -r '.tag_name')
        DOWNLOAD_URL=$(echo "$data" | jq -r '.assets[0].browser_download_url')
        VERSION_INFO=$(echo "$data" | jq -r '.body')
        ADDITIONAL_INFO=$(curl -sL https://raw.githubusercontent.com/WenqiOfficial/aseprite_builder/master/release.md)

        echo "${LATEST_TAG}" > ${LATEST_TAG}.txt
        echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
        echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
        echo "version_info<<EOF" >> $GITHUB_OUTPUT
        echo "$VERSION_INFO" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "additional_info<<EOF" >> $GITHUB_OUTPUT
        echo "$ADDITIONAL_INFO" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Load version from cache
      id: version_check
      uses: actions/cache@v3
      with:
        path: ${{ steps.version_info.outputs.latest_tag }}.txt
        key: cached_version
    - name: Should we start new build?
      id: should_build
      if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix' || steps.version_check.outputs.cache-hit != 'true'
      run: echo "should_build=true" >> $GITHUB_OUTPUT
    - name: Create Release
      id: create_release
      if: steps.should_build.outputs.should_build
      run: |
        RESPONSE=$(curl -sL -X POST "https://api.github.com/repos/${{ github.repository }}/releases"           -H "Authorization: Bearer ${{ secrets.GH_RELEASE_TOKEN }}"           -H "Accept: application/vnd.github.v3+json"           -d '{
            "tag_name": "${{ steps.version_info.outputs.latest_tag }}",
            "name": "Aseprite ${{ steps.version_info.outputs.latest_tag }}",
            "body": "PLACEHOLDER_RELEASE_BODY",
            "draft": true,
            "prerelease": false
          }')
        UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.upload_url' | sed 's/{.*//')
        echo "upload_url=${UPLOAD_URL}" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

  build-aseprite:
    name: Build Aseprite (Windows)
    needs: check-version
    if: ${{ needs.check-version.outputs.should_build }}
    runs-on: windows-latest
    steps:
      - name: Install ninja
        uses: seanmiddleditch/gha-setup-ninja@v3
      - name: Remove OpenSSL from PATH
        shell: powershell
        run: Remove-Item -Recurse -Force "C:\Program Files\OpenSSL\"
      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v3
        with:
          path: skia
          key: skia-windows-cache
      - name: Download Skia if not in cache
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          curl -o Skia-Windows-Release-X64.zip -L https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
          unzip Skia-Windows-Release-X64.zip -d skia
      - name: Download Aseprite source
        run: |
          curl -o Aseprite-source.zip -L ${{ needs.check-version.outputs.download_url }}
          unzip Aseprite-source.zip -d aseprite
          mkdir -p aseprite/build
      - name: Setting Visual Studio build environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v4
      - name: Run CMake
        working-directory: aseprite/build
        shell: pwsh
        run: cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_IGNORE_PATH='C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/' -DLAF_BACKEND=skia -DSKIA_DIR="$(Convert-Path ../../skia)" -DSKIA_LIBRARY_DIR="$(Convert-Path ../../skia/out/Release-x64)" -DSKIA_LIBRARY="$(Convert-Path ../../skia/out/Release-x64/skia.lib)" -G Ninja ..
      - name: Run Ninja
        working-directory: aseprite/build
        run: ninja aseprite -j4
      - name: Clean up build
        working-directory: aseprite/build/bin
        shell: bash
        run: rm -f gen modp_b64_gen gen.exe gen.exe.manifest modp_b64_gen.exe modp_b64_gen.exe.manifest
      - name: Make portable zip
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
      - name: Create zip
        working-directory: aseprite/build/bin
        run: 7z -tzip a Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip *
      - name: Upload release asset
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          ASSET="Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip"
          curl -sL -X POST "${{ needs.check-version.outputs.upload_url }}?name=$(basename "$ASSET")"             -H "Authorization: Bearer ${{ secrets.GH_RELEASE_TOKEN }}"             -H "Content-Type: application/zip"             --data-binary @"$ASSET"
      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          RELEASE_ID=$(curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.check-version.outputs.latest_tag }}"             -H "Authorization: Bearer ${{ secrets.GH_RELEASE_TOKEN }}"             -H "Accept: application/vnd.github.v3+json" | jq -r '.id')
          curl -sL -X PATCH "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"             -H "Authorization: Bearer ${{ secrets.GH_RELEASE_TOKEN }}"             -H "Accept: application/vnd.github.v3+json"             -d '{"draft": false}'
